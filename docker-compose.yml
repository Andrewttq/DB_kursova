services:
  mongo:
    image: mongo:7

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db
  writer-service:
    build:
      context: .
      dockerfile: writer-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    command: ["python", "-m", "writer_service.demo"]


  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"


  query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
     MONGO_URL: mongodb://mongo:27017
     REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
       condition: service_healthy


volumes:
  mongo-data:
