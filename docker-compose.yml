services:
  mongo:
    image: mongo:7

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    ports:
      - "6379:6379"

volumes:
  mongo-data:
  mongo-cfg:
    image: mongo:8.0
    command: mongod --configsvr --replSet cfgRS --port 27017 --bind_ip_all
    volumes:
      - cfg-data:/data/db
    restart: unless-stopped

  mongo-shard1:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard1-data:/data/db
    restart: unless-stopped

  mongo-shard2:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard2-data:/data/db
    restart: unless-stopped

  mongo-shard3:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard3RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard3-data:/data/db
    restart: unless-stopped

  mongos:
    image: mongo:8.0
    command: mongos --configdb cfgRS/mongo-cfg:27017 --port 27017 --bind_ip_all
    ports: ["27017:27017"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  cfg-data:
  shard1-data:
  shard2-data:
  shard3-data:
