[project]
name = "ingest-service"
version = "0.1.0"
description = "Читає рецепти з CSV із заданою швидкістю і публікує їх у RabbitMQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "aio-pika>=9.4",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_service"]

[tool.uv.sources]
contracts = { workspace = true }
