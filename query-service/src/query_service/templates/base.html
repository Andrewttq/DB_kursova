{# Базовий шаблон: шапка, стилі, HTMX. Сторінки наслідують його через {% extends "base.html" %}. #}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipes Hub{% endblock %}</title>
  <!-- HTMX: атрибути hx-* у розмітці замість власного JavaScript -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { --line: #e3e3e3; --muted: #6b6b6b; --accent: #b4441f; --bg-soft: #f7f5f2; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 0 1rem 3rem;
           color: #1d1d1d; line-height: 1.45; }
    header { display: flex; gap: 1.5rem; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid var(--line);
             margin-bottom: 1.5rem; flex-wrap: wrap; }
    header .logo { font-weight: 700; font-size: 1.25rem; color: var(--accent); text-decoration: none; }
    header nav a { margin-right: 1rem; color: #1d1d1d; text-decoration: none; }
    header nav a:hover { color: var(--accent); }
    section { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    h1 { margin: .2rem 0 .8rem; } h2 { margin: 0 0 .6rem; font-size: 1.15rem; }
    a { color: var(--accent); }
    em { background: #fff1a8; font-style: normal; padding: 0 1px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; background: var(--bg-soft);
             border: 1px solid var(--line); }
    .badge.ok { background: #e7f6ea; border-color: #b9e2c1; } .badge.empty { background: #fbeaea; border-color: #efc4c4; }
    .badge.cache { background: #e8f0fd; border-color: #bcd0f5; }
    input, select, button { font: inherit; padding: .4rem .6rem; border: 1px solid #c9c9c9; border-radius: 6px; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent); }
    input[type=search] { width: 100%; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
    th { font-weight: 600; background: var(--bg-soft); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .hit { padding: .6rem 0; border-bottom: 1px solid var(--line); }
    .hit:last-child { border-bottom: 0; }
    .hit p { margin: .2rem 0 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; }
    .metric { background: var(--bg-soft); border-radius: 8px; padding: .5rem .7rem; }
    .metric b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
    .filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; margin-bottom: .8rem; }
    .filters label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); }
    .htmx-request .loading { display: inline; } .loading { display: none; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Recipes Hub</a>
    <nav>
      <a href="/">Пошук і моніторинг</a>
      <a href="/recipes">Рецепти</a>
      <a href="/analytics">Аналітика по шардах</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
