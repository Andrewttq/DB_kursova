[project]
name = "query-service"
version = "0.1.0"
description = "Query-сторона CQRS: пошук, картки рецептів, рекомендації, статистика та веб-інтерфейс"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pymongo>=4.13",
    "elasticsearch[async]>=8.15,<9",
    "neo4j>=5.24",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_service"]
