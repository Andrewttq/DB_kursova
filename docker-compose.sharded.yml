# Шардований кластер MongoDB (завдання 13): config server, 3 шарди, маршрутизатор mongos.
# Запуск:
#     docker compose -f docker-compose.sharded.yml up -d
# Сервіс mongo-init один раз налаштовує кластер (scripts/init-cluster.js) і завершується.
# Перевірити: docker compose -f docker-compose.sharded.yml logs mongo-init
# Застосунок підключається до mongos: MONGO_URL=mongodb://localhost:27018 у .env
services:
  mongo-cfg:
    image: mongo:8.0
    command: mongod --configsvr --replSet cfgRS --port 27017 --bind_ip_all
    volumes:
      - cfg-data:/data/db
    restart: unless-stopped

  mongo-shard1:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard1-data:/data/db
    restart: unless-stopped

  mongo-shard2:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard2-data:/data/db
    restart: unless-stopped

  mongo-shard3:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard3RS --port 27017 --bind_ip_all --wiredTigerCacheSizeGB 0.25
    volumes:
      - shard3-data:/data/db
    restart: unless-stopped

  mongos:
    image: mongo:8.0
    command: mongos --configdb cfgRS/mongo-cfg:27017 --port 27017 --bind_ip_all
    ports: ["27018:27017"]
    depends_on: [mongo-cfg, mongo-shard1, mongo-shard2, mongo-shard3]
    restart: unless-stopped

  # Одноразове налаштування: ініціалізація replica set-ів, addShard, шардування колекції.
  mongo-init:
    image: mongo:8.0
    depends_on: [mongos]
    volumes:
      - ./scripts/init-cluster.js:/scripts/init-cluster.js:ro
    command: mongosh --nodb --quiet /scripts/init-cluster.js
    restart: "no"

volumes:
  cfg-data:
  shard1-data:
  shard2-data:
  shard3-data:
