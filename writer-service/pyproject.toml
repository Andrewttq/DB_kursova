[project]
name = "writer-service"
version = "0.1.0"
description = "Command-сторона CQRS: читає рецепти з RabbitMQ і записує їх у MongoDB, Neo4j та Elasticsearch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "aio-pika>=9.4",
    "pymongo>=4.13",
    "elasticsearch[async]>=8.15,<9",
    "neo4j>=5.24",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writer_service"]

[tool.uv.sources]
contracts = { workspace = true }
