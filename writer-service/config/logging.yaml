# Налаштування логування (формат logging.config.dictConfig).
# Рівень змінюється тут, без правок коду:
#   ERROR   — лише критичні збої
#   WARNING — те, що має насторожити
#   INFO    — корисна статистика (скільки документів записано в кожну БД)
#   DEBUG   — деталі для розробника (час відповіді кожної БД на пачку)
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
  file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/writer_service.log
    maxBytes: 1000000
    backupCount: 3
    encoding: utf-8
    formatter: standard

loggers:
  writer_service:
    level: INFO
  aio_pika:
    level: WARNING

root:
  level: WARNING
  handlers: [console, file]
